openapi: "3.0.0"
info:
  version: 1.0.0
  title: Swagger Petstore
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths: {}
components:
  schemas:
    TransportationDevice:
      type: object
      required:
        - deviceType
        - make
        - model
      properties:
        deviceType:
          type: string
          enum:
            - bike
            - skateboard
            - rollerskates
            - Ho_ver-boaRD
        make:
          type: string
        model:
          type: string
    Pet:
      type: object
      required:
        - id
        - name
        - dateOfBirth
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
        dateOfBirth:
          type: string
          format: date
        lastFedAt:
          type: string
          format: date-time
        earTagUuid:
          type: string
          format: uuid
        imageUrl:
          type: string
          format: uri
        aListOfUuids:
          type: array
          items:
            type: string
            format: uuid
    Pets:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/Pet"
    # Polymorphic type with type as discriminator
    Phone:
      oneOf:
        - $ref: "#/components/schemas/LandlinePhone"
        - $ref: "#/components/schemas/MobilePhone"
      discriminator:
        propertyName: type
        mapping:
          landline: '#/components/schemas/LandlinePhone'
          mobile: '#/components/schemas/MobilePhone'
    LandlinePhone:
      type: object
      required:
        - type
        - number
        - area_code
      properties:
        type:
          type: string
        number:
          type: string
        area_code:
          type: string
    MobilePhone:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
        number:
          type: string
    # Polymorphic type with moduleType as discriminator
    Module:
      oneOf:
        - $ref: "#/components/schemas/ModuleA"
        - $ref: "#/components/schemas/ModuleB"
      discriminator:
        propertyName: moduleType
        mapping:
          a: '#/components/schemas/ModuleA'
          b: '#/components/schemas/ModuleB'
    ModuleA:
      type: object
      required:
          - moduleType
      properties:
        moduleType:
          type: string
    ModuleB:
      type: object
      required:
        - moduleType
      properties:
        moduleType:
          type: string
    # Polymorphic type with enum as discriminator
    State:
      oneOf:
        - $ref: "#/components/schemas/StateA"
        - $ref: "#/components/schemas/StateB"
      discriminator:
        propertyName: status
        mapping:
          a: '#/components/schemas/StateA'
          b: '#/components/schemas/StateB'
    StateA:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Status'
    StateB:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Status'
    Status:
      type: string
      enum:
        - a
        - b
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    # Arrays
    ArrayHolder:
      type: object
      properties:
        unique_objects:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BasicObject'
        unique_ints:
          type: array
          uniqueItems: true
          items:
            type: integer
        non_unique_objects:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/BasicObject'
    BasicObject:
      type: object
      properties:
        one:
          type: string
    # allOf polymorphism: discriminated parent with allOf child schemas (issue #627)
    ParentAction:
      type: object
      discriminator:
        propertyName: actionType
        mapping:
          CHILD_A: '#/components/schemas/ChildActionA'
          CHILD_B: '#/components/schemas/ChildActionB'
      properties:
        actionType:
          type: string
          enum:
            - CHILD_A
            - CHILD_B
        createdBy:
          type: string
      required:
        - actionType
    ChildActionA:
      allOf:
        - $ref: '#/components/schemas/ParentAction'
        - type: object
          properties:
            fieldA:
              type: string
    ChildActionB:
      allOf:
        - $ref: '#/components/schemas/ParentAction'
        - type: object
          properties:
            fieldB:
              type: integer
    # oneOf sealed interface over the allOf children, sharing the parent's discriminator
    ChildActionsAll:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/ChildActionA'
          - $ref: '#/components/schemas/ChildActionB'
        discriminator:
          propertyName: actionType
          mapping:
            CHILD_A: '#/components/schemas/ChildActionA'
            CHILD_B: '#/components/schemas/ChildActionB'
    # allOf polymorphism without an explicit discriminator mapping: values default to the
    # schema names. Also carries a required inherited property.
    Vehicle:
      type: object
      discriminator:
        propertyName: vehicleType
      properties:
        vehicleType:
          type: string
        wheels:
          type: integer
      required:
        - vehicleType
        - wheels
    Car:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            trunkSize:
              type: string
    Truck:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            payload:
              type: integer
