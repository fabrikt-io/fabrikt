openapi: 3.0.3
info:
  title: Runtime model validation
  version: '1.0'
paths: {}
components:
  schemas:
    StringValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    IntegerValue:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
    DecimalValue:
      type: object
      required: [value]
      properties:
        value:
          type: number
          minimum: 1.5
          maximum: 9.5
          exclusiveMinimum: true
          exclusiveMaximum: true
    ListValue:
      type: object
      required: [value]
      properties:
        value:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
    NestedValue:
      type: object
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/StringValue'
    NestedListValue:
      type: object
      required: [value]
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/StringValue'
    DirectEnumValue:
      type: object
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/ConstrainedEnum'
    InlineEnumValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          enum: [ready, busy]
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    AllOfEnumValue:
      type: object
      required: [value]
      properties:
        value:
          allOf:
            - $ref: '#/components/schemas/Status'
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    AnyOfEnumValue:
      type: object
      required: [value]
      properties:
        value:
          anyOf:
            - $ref: '#/components/schemas/Status'
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    UuidValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f-]+$'
    Status:
      type: string
      enum: [ready, busy]
    ConstrainedEnum:
      type: string
      enum: [ready, busy]
      minLength: 2
      maxLength: 5
      pattern: '^[a-z]+$'
