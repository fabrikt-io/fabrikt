openapi: 3.0.3
info:
  title: Runtime model validation
  version: '1.0'
paths: {}
components:
  schemas:
    StringValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    IntegerValue:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
    DecimalValue:
      type: object
      required: [value]
      properties:
        value:
          type: number
          minimum: 1.5
          maximum: 9.5
          exclusiveMinimum: true
          exclusiveMaximum: true
    ListValue:
      type: object
      required: [value]
      properties:
        value:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
    NestedValue:
      type: object
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/StringValue'
    NestedListValue:
      type: object
      required: [value]
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/StringValue'
    NestedSetValue:
      type: object
      required: [value]
      properties:
        value:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StringValue'
    MapValue:
      type: object
      required: [value]
      properties:
        value:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StringValue'
    TypedMapValue:
      type: object
      required: [value]
      properties:
        value:
          type: object
          additionalProperties:
            type: object
            required: [text]
            properties:
              text:
                type: string
                minLength: 2
                maxLength: 5
                pattern: '^[a-z]+$'
    DirectEnumValue:
      type: object
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/ConstrainedEnum'
    InlineEnumValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          enum: [ready, busy]
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    AllOfEnumValue:
      type: object
      required: [value]
      properties:
        value:
          allOf:
            - $ref: '#/components/schemas/Status'
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    AnyOfEnumValue:
      type: object
      required: [value]
      properties:
        value:
          anyOf:
            - $ref: '#/components/schemas/Status'
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    UuidValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f-]+$'
    CustomTypeValue:
      type: object
      required: [value, values]
      properties:
        value:
          $ref: '#/components/schemas/CurrencyCode'
        values:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/CurrencyCode'
    DateTimeValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          format: date-time
          maxLength: 25
          pattern: '^\d{4}-\d{2}-\d{2}T.+$'
    MappedObjectValue:
      type: object
      required: [value, values]
      properties:
        value:
          $ref: '#/components/schemas/MappedObject'
        values:
          type: array
          items:
            $ref: '#/components/schemas/MappedObject'
    Status:
      type: string
      enum: [ready, busy]
    ConstrainedEnum:
      type: string
      enum: [ready, busy]
      minLength: 2
      maxLength: 5
      pattern: '^[a-z]+$'
    CurrencyCode:
      type: string
      format: iso-4217
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
    MappedObject:
      type: object
      format: mapped-object
      required: [value]
      properties:
        value:
          type: string
          minLength: 2
