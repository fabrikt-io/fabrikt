openapi: 3.0.0
paths:
  /request-media-object:
    post:
      operationId: createRequestMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  minLength: 1
          text/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  minLength: 1
      responses:
        '204':
          description: Success
  /request-media-array:
    post:
      operationId: arrayRequestMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [label]
                properties:
                  label:
                    type: string
                    minLength: 1
          text/json:
            schema:
              type: array
              items:
                type: object
                required: [label]
                properties:
                  label:
                    type: string
                    minLength: 1
      responses:
        '204':
          description: Success
info:
  title:
  version:
components:
  schemas:
    # Deep nested polymorphism
    RootDiscriminator:
      type: string
      enum:
        - firstLevelChild

    FirstLevelDiscriminator:
      type: string
      enum:
        - secondLevelChild1
        - secondLevelChild2

    SecondLevelDiscriminator:
      type: string
      enum:
        - thirdLevelChild1
        - thirdLevelChild2

    RootType:
      type: object
      required:
        - rootField1
      discriminator:
        propertyName: rootDiscriminator
        mapping:
          firstLevelChild: '#/components/schemas/FirstLevelChild'
      properties:
        rootDiscriminator:
          $ref: "#/components/schemas/RootDiscriminator"
        rootField1:
          type: string
          description: this is a rootField1
        rootField2:
          type: boolean
          description: this is a rootField2

    FirstLevelChild:
      allOf:
        - $ref: '#/components/schemas/RootType'
        - type: object
          required:
            - firstLevelField1
          discriminator:
            propertyName: firstLevelDiscriminator
            mapping:
              secondLevelChild1: '#/components/schemas/SecondLevelChild1'
              secondLevelChild2: '#/components/schemas/SecondLevelChild2'
          properties:
            firstLevelDiscriminator:
              $ref: '#/components/schemas/FirstLevelDiscriminator'
            firstLevelField1:
              type: string
            firstLevelField2:
              type: integer

    SecondLevelChild1:
      allOf:
        - $ref: '#/components/schemas/FirstLevelChild'
        - type: object
          required:
            - metadata
          discriminator:
            propertyName: secondLevelDiscriminator
            mapping:
              thirdLevelChild1: '#/components/schemas/ThirdLevelChild11'
              thirdLevelChild2: '#/components/schemas/ThirdLevelChild12'
          properties:
            secondLevelDiscriminator:
              $ref: '#/components/schemas/SecondLevelDiscriminator'
            metadata:
              $ref: '#/components/schemas/SecondLevelMetadata'

    SecondLevelChild2:
      allOf:
        - $ref: '#/components/schemas/FirstLevelChild'
        - type: object
          required:
            - metadata
          discriminator:
            propertyName: secondLevelDiscriminator
            mapping:
              thirdLevelChild1: '#/components/schemas/ThirdLevelChild21'
              thirdLevelChild2: '#/components/schemas/ThirdLevelChild22'
          properties:
            secondLevelDiscriminator:
              $ref: '#/components/schemas/SecondLevelDiscriminator'
            metadata:
              $ref: '#/components/schemas/SecondLevelMetadata'

    SecondLevelMetadata:
      type: object
      required:
        - obj
      properties:
        obj:
          $ref: "#/components/schemas/CommonObject"

    ThirdLevelChild11:
      allOf:
        - $ref: '#/components/schemas/SecondLevelChild1'
        - type: object
          required:
            - creationDate
          properties:
            creationDate:
              type: integer
              description: timestamp

    ThirdLevelChild12:
      allOf:
        - $ref: '#/components/schemas/SecondLevelChild1'
        - type: object
          required:
            - isDeleted
          properties:
            isDeleted:
              type: boolean

    ThirdLevelChild21:
      allOf:
        - $ref: '#/components/schemas/SecondLevelChild2'
        - type: object
          required:
            - creationDate
          properties:
            creationDate:
              type: integer
              description: timestamp

    ThirdLevelChild22:
      allOf:
        - $ref: '#/components/schemas/SecondLevelChild2'
        - type: object
          required:
            - isDeleted
          properties:
            isDeleted:
              type: boolean

    CommonObject:
      type: object
      required:
        - filed1
        - field2
      properties:
        filed1:
          type: string
          required: true
          nullable: false
          description: commonField1
        field2:
          type: string
          required: true
          nullable: false
          description: commonField2

    # Polymorphism
    PolymorphicTypeOneRef:
      $ref: "#/components/schemas/PolymorphicTypeOne"
    PolymorphicTypeOneAnotherRef:
      $ref: "#/components/schemas/PolymorphicTypeOne"
    PolymorphicSuperType:
      type: object
      discriminator:
        propertyName: generation
      required:
        - generation
        - first_name
        - last_name
      properties:
        generation:
          type: string
        first_name:
          type: string
        last_name:
          type: string
    PolymorphicTypeOne:
      allOf:
        - $ref: "#/components/schemas/PolymorphicSuperType"
        - type: object
          properties:
            child_one_name:
              type: string
    PolymorphicTypeTwo:
      allOf:
        - $ref: "#/components/schemas/PolymorphicSuperType"
        - type: object
          properties:
            child_two_age:
              type: integer
              format: int32
    # Maps
    MapHolder:
      type: object
      properties:
        wild_card:
          type: object
        string_map:
          $ref: '#/components/schemas/StringMap'
        typed_object_map:
          $ref: '#/components/schemas/TypedObjectMap'
        object_map:
          $ref: '#/components/schemas/ObjectMap'
        inlined_string_map:
          type: object
          additionalProperties:
            type: string
        inlined_object_map:
          type: object
          additionalProperties:
            type: object
        inlined_unknown_map:
          type: object
          additionalProperties: true
        inlined_typed_object_map:
          type: object
          additionalProperties:
            type: object
            properties:
              code:
                type: integer
              text:
                type: string
        complex_object_with_untyped_map:
          $ref: '#/components/schemas/ComplexObjectWithUntypedMap'
        complex_object_with_typed_map:
          $ref: '#/components/schemas/ComplexObjectWithTypedMap'
        inlined_complex_object_with_untyped_map:
          type: object
          properties:
            text:
              type: string
            code:
              type: integer
          additionalProperties: true
        inlined_complex_object_with_typed_map:
          type: object
          properties:
            text:
              type: string
            code:
              type: integer
          additionalProperties:
            type: object
            properties:
              other_text:
                type: string
              other_number:
                type: integer
      additionalProperties:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/components/schemas/ExternalObjectFour'

    ExternalObjectFour:
      type: object
      properties:
        blah:
          type: string

    ComplexObjectWithUntypedMap:
      type: object
      properties:
        text:
          type: string
        code:
          type: integer
      additionalProperties:
        type: object

    ComplexObjectWithTypedMap:
      type: object
      properties:
        text:
          type: string
        code:
          type: integer
      additionalProperties:
        type: object
        properties:
          other_text:
            type: string
          other_number:
            type: integer

    ComplexObjectWithRefTypedMap:
      type: object
      properties:
        text:
          type: string
        code:
          type: integer
      additionalProperties:
        $ref: '#/components/schemas/SomeRef'

    SomeRef:
      type: object
      properties:
        other_text:
          type: string
        other_number:
          type: integer

    ComplexObjectWithMapsOfMaps:
      type: object
      required:
        - errors
      properties:
        list-others:
          type: array
          items:
            $ref: '#/components/schemas/BasicObject'
        map-of-maps:
          type: object
          additionalProperties:
            type: object
            minProperties: 1
            additionalProperties:
              $ref: '#/components/schemas/BasicObject'

    BasicObject:
      type: object
      properties:
        one:
          type: string
    StringMap:
      type: object
      additionalProperties:
        type: string

    TypedObjectMap:
      type: object
      additionalProperties:
        type: object
        properties:
          code:
            type: integer
          text:
            type: string

    ObjectMap:
      type: object
      additionalProperties:
        type: object

    # Enums
    EnumHolder:
      type: object
      properties:
        array_of_enums:
          type: array
          items:
            type: string
            x-extensible-enum:
              - array_enum_one
              - array_enum_two
        inlined_enum:
          type: string
          enum:
            - inlined_one
            - inlined_two
            - inlined_three
        inlined_extensible_enum:
          type: string
          x-extensible-enum:
            - inlined_one
            - inlined_two
            - inlined_three
        enum_ref:
          $ref: '#/components/schemas/EnumObject'
        extensible_enum_ref:
          $ref: '#/components/schemas/ExtensibleEnumObject'
        list_enums:
          $ref: '#/components/schemas/ListEnums'

    EnumObject:
      type: string
      enum:
        - one
        - two
        - three
        - 4
        - -5
        - _6

    ExtensibleEnumObject:
      type: string
      x-extensible-enum:
        - active
        - inactive

    ContentType:
      type: string
      x-extensible-enum:
        - application/json
        - application/x.some-type+json
        - application/x.some-other-type+json;version=2

    ListEnums:
      type: array
      items:
        $ref: '#/components/schemas/ContentType'

    # Arrays
    ArrayHolder:
      type: object
      properties:
        unique_objects:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BasicObject'
        unique_ints:
          type: array
          uniqueItems: true
          items:
            type: integer
        non_unique_objects:
          type: array
          uniqueItems: false
          items:
            $ref: '#/components/schemas/BasicObject'


    FooBars:
      type: object
      properties:
        prop_one:
          $ref: '#/components/schemas/Foo'
        prop_two:
          $ref: '#/components/schemas/Bar'

    Foo:
      type: array
      items:
        type: string
        enum:
          - X
          - Y
    Bar:
      type: array
      items:
        type: object
        properties:
          bar_prop:
            type: string

    FloatWithDefaultValue:
      type: object
      properties:
        float_with_default_integer:
          type: number
          format: float
          default: 0
        double_with_default_integer:
          type: number
          format: double
          default: 0
        float_with_default_float:
          type: number
          format: float
          default: 0.1
        double_with_default_float:
          type: number
          format: double
          default: 0.1

    RelativePetHolder:
      type: object
      properties:
        pet:
          $ref: './RelativePet.yaml'
        owner:
          $ref: './RelativeOwner.yaml'

    # Required primitives - for testing issue #489
    RequiredPrimitives:
      type: object
      required:
        - required_string
        - required_int
        - required_long
        - required_double
        - required_float
        - required_boolean
      properties:
        required_string:
          type: string
        required_int:
          type: integer
          format: int32
        required_long:
          type: integer
          format: int64
        required_double:
          type: number
          format: double
        required_float:
          type: number
          format: float
        required_boolean:
          type: boolean
        optional_int:
          type: integer
          format: int32

    OrderX: {"type": "object", "required": ["id", "kind"], "properties": {"id": {"type": "string"}, "kind": {"type": "string"}}, "discriminator": {"propertyName": "kind", "mapping": {"child": "#/components/schemas/OrderChild", "sibling": "#/components/schemas/OrderSibling"}}}

    OrderChild: {"allOf": [{"type": "object", "required": ["label"], "properties": {"label": {"type": "string"}}}, {"$ref": "#/components/schemas/OrderX"}]}

    OrderSibling: {"allOf": [{"type": "object", "required": ["count"], "properties": {"count": {"type": "integer", "format": "int32"}}}, {"$ref": "#/components/schemas/OrderX"}]}

    OrderHolder: {"type": "object", "required": ["value", "choice"], "properties": {"value": {"$ref": "#/components/schemas/OrderX"}, "choice": {"oneOf": [{"$ref": "#/components/schemas/OrderChild"}, {"$ref": "#/components/schemas/OrderSibling"}]}, "choices": {"type": "array", "items": {"oneOf": [{"$ref": "#/components/schemas/OrderChild"}, {"$ref": "#/components/schemas/OrderSibling"}]}}}}
    DeductionChoice: {"oneOf": [{"$ref": "#/components/schemas/DeductionA"}, {"$ref": "#/components/schemas/DeductionB"}], "x-jackson-subtype-deduction": true}

    DeductionA: {"type": "object", "required": ["a"], "properties": {"a": {"type": "string", "minLength": 1}}}

    DeductionB: {"type": "object", "required": ["b"], "properties": {"b": {"type": "integer", "format": "int32"}}}

    DeductionHolder: {"type": "object", "required": ["value"], "properties": {"value": {"$ref": "#/components/schemas/DeductionChoice"}, "choices": {"type": "array", "items": {"$ref": "#/components/schemas/DeductionChoice"}, "default": []}, "byKey": {"type": "object", "additionalProperties": {"$ref": "#/components/schemas/DeductionChoice"}}, "optional": {"$ref": "#/components/schemas/DeductionChoice"}}}

    ComposedNestedX: {"type": "object", "required": ["id"], "properties": {"id": {"type": "string", "minLength": 1}}}

    ComposedNestedA: {"type": "object", "required": ["a"], "properties": {"a": {"type": "string"}}}

    ComposedNestedB: {"type": "object", "required": ["b"], "properties": {"b": {"type": "integer", "format": "int32"}}}

    ComposedNestedCombined: {"allOf": [{"$ref": "#/components/schemas/ComposedNestedX"}, {"oneOf": [{"$ref": "#/components/schemas/ComposedNestedA"}, {"$ref": "#/components/schemas/ComposedNestedB"}]}]}

    ComposedNestedHolder: {"type": "object", "required": ["value"], "properties": {"value": {"$ref": "#/components/schemas/ComposedNestedCombined"}}}

    ComposedNamedX: {"type": "object", "required": ["id"], "properties": {"id": {"type": "string", "minLength": 1}}}

    ComposedNamedA: {"type": "object", "required": ["a"], "properties": {"a": {"type": "string"}}}

    ComposedNamedB: {"type": "object", "required": ["b"], "properties": {"b": {"type": "integer", "format": "int32"}}}

    ComposedNamedVariant: {"oneOf": [{"$ref": "#/components/schemas/ComposedNamedA"}, {"$ref": "#/components/schemas/ComposedNamedB"}]}

    ComposedNamedCombined: {"allOf": [{"$ref": "#/components/schemas/ComposedNamedX"}, {"$ref": "#/components/schemas/ComposedNamedVariant"}]}

    ComposedNamedHolder: {"type": "object", "required": ["value"], "properties": {"value": {"$ref": "#/components/schemas/ComposedNamedCombined"}}}

    ComposedSiblingX: {"type": "object", "required": ["id"], "properties": {"id": {"type": "string", "minLength": 1}}}

    ComposedSiblingA: {"type": "object", "required": ["a"], "properties": {"a": {"type": "string"}}}

    ComposedSiblingB: {"type": "object", "required": ["b"], "properties": {"b": {"type": "integer", "format": "int32"}}}

    ComposedSiblingCombined: {"allOf": [{"$ref": "#/components/schemas/ComposedSiblingX"}], "oneOf": [{"$ref": "#/components/schemas/ComposedSiblingA"}, {"$ref": "#/components/schemas/ComposedSiblingB"}]}

    ComposedSiblingHolder: {"type": "object", "required": ["value"], "properties": {"value": {"$ref": "#/components/schemas/ComposedSiblingCombined"}}}

    ComposedDeducedX: {"type": "object", "required": ["id"], "properties": {"id": {"type": "string", "minLength": 1}}}

    ComposedDeducedA: {"type": "object", "required": ["a"], "properties": {"a": {"type": "string"}}}

    ComposedDeducedB: {"type": "object", "required": ["b"], "properties": {"b": {"type": "integer", "format": "int32"}}}

    ComposedDeducedCombined: {"allOf": [{"$ref": "#/components/schemas/ComposedDeducedX"}, {"oneOf": [{"$ref": "#/components/schemas/ComposedDeducedA"}, {"$ref": "#/components/schemas/ComposedDeducedB"}], "x-jackson-subtype-deduction": true}]}

    ComposedDeducedHolder: {"type": "object", "required": ["value"], "properties": {"value": {"$ref": "#/components/schemas/ComposedDeducedCombined"}, "values": {"type": "array", "items": {"$ref": "#/components/schemas/ComposedDeducedCombined"}, "default": []}, "byKey": {"type": "object", "additionalProperties": {"$ref": "#/components/schemas/ComposedDeducedCombined"}}}}

    ComposedTaggedX: {"type": "object", "required": ["id"], "properties": {"id": {"type": "string", "minLength": 1}}}

    ComposedTaggedA: {"type": "object", "required": ["a", "kind"], "properties": {"a": {"type": "string"}, "kind": {"type": "string", "enum": ["a"]}}}

    ComposedTaggedB: {"type": "object", "required": ["b", "kind"], "properties": {"b": {"type": "integer", "format": "int32"}, "kind": {"type": "string", "enum": ["b"]}}}

    ComposedTaggedCombined: {"allOf": [{"$ref": "#/components/schemas/ComposedTaggedX"}, {"oneOf": [{"$ref": "#/components/schemas/ComposedTaggedA"}, {"$ref": "#/components/schemas/ComposedTaggedB"}], "discriminator": {"propertyName": "kind", "mapping": {"a": "#/components/schemas/ComposedTaggedA", "b": "#/components/schemas/ComposedTaggedB"}}}]}

    ComposedTaggedHolder: {"type": "object", "required": ["value"], "properties": {"value": {"$ref": "#/components/schemas/ComposedTaggedCombined"}, "values": {"type": "array", "items": {"$ref": "#/components/schemas/ComposedTaggedCombined"}, "default": []}, "byKey": {"type": "object", "additionalProperties": {"$ref": "#/components/schemas/ComposedTaggedCombined"}}}}
