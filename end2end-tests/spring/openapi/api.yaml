openapi: "3.0.3"
info:
  title: Parameter Defaults Example
  version: "1.0"
paths:
  /example:
    get:
      operationId: getExample
      summary: Echoes back the resolved parameter values
      parameters:
        - name: param1
          in: header
          required: false
          schema:
            type: string
            default: paramValue
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: filter
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParameterEcho"
  /patterns:
    get:
      operationId: getPatterns
      summary: Accepts string parameters with the same patterns as PatternValues
      parameters:
        - name: unanchored
          in: query
          required: true
          schema:
            type: string
            pattern: '[a-zA-Z]'
        - name: anchored
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
        - name: literal
          in: query
          required: true
          schema:
            type: string
            pattern: '^\$[0-9]+[$]$'
      responses:
        "204":
          description: No Content
components:
  schemas:
    ParameterEcho:
      type: object
      properties:
        param1:
          type: string
        limit:
          type: integer
        filter:
          type: string
    PatternValues:
      type: object
      required: [unanchored, anchored, literal]
      properties:
        unanchored:
          type: string
          pattern: '[a-zA-Z]'
        anchored:
          type: string
          pattern: '^[0-9]+$'
        literal:
          type: string
          pattern: '^\$[0-9]+[$]$'
