openapi: 3.0.0
paths:
  /test:
    get:
      operationId: test
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
components:
  schemas:
    Result:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/Base'

    Base:
      properties:
        foo:
          type: string

    Person:
      allOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1

    Example:
      type: object
      required: [wrappedRequired]
      properties:
        direct:
          $ref: '#/components/schemas/Person'
        wrapped:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Person'
        wrappedRequired:
          allOf:
            - $ref: '#/components/schemas/Person'
        people:
          type: array
          items:
            nullable: true
            allOf:
              - $ref: '#/components/schemas/Person'
