openapi: 3.0.0
# See mapExamples for many more examples of how additional properties are used
components:
  schemas:
    Result:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      additionalProperties: true # allow additional properties of any type
    ResultWithoutAdditionalProperties:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      additionalProperties: false # explicitly disallow additional properties
    ResultWithImplicitAdditionalProperties:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    AdditionalPropertiesSerializer:
      type: object
      required:
        - id
      properties:
        id:
          type: string
      additionalProperties: true
