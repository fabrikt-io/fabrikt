openapi: 3.0.0
components:
  schemas:
    NormalizedNameConflation:
      type: object
      properties:
        x:
          type: string
          description: Description of lowercase x
        X:
          type: string
          description: Description of uppercase X
        fooBar:
          type: string
          description: Description of camel case fooBar
        foo_bar:
          type: string
          description: Description of snake case foo_bar
        aBC:
          type: string
          description: Description of aBC
        ABC:
          type: string
          description: Description of ABC
        a_b_c:
          type: string
          description: Description of a_b_c
        control_case:
          type: string
          description: Description of control_case - this should get normalized because it conflicts with no other property
    Grandparent:
      type: object
      required: ['$type']
      properties:
        $type:
          type: string
      discriminator:
        propertyName: $type
        mapping:
          parent: '#/components/schemas/Parent'
          child: '#/components/schemas/Child'
    Parent:
      type: object
      allOf:
        - $ref: '#/components/schemas/Grandparent'
        - type: object
          properties:
            type:
              type: string
              nullable: true
    Child:
      type: object
      allOf:
        - $ref: '#/components/schemas/Parent'
        - type: object
          properties:
            value:
              type: string
