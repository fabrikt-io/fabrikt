openapi: 3.0.0
components:
  schemas:
    PolymorphicType:
      discriminator:
        propertyName: generation
      oneOf:
        - $ref: "#/components/schemas/PolymorphicTypeOne"
        - $ref: "#/components/schemas/polymorphic_type_two"

    PolymorphicTypeOneRef:
      $ref: "#/components/schemas/PolymorphicTypeOne"
    PolymorphicTypeOneAnotherRef:
      $ref: "#/components/schemas/PolymorphicTypeOne"
    PolymorphicTypeTwoRef:
      $ref: "#/components/schemas/polymorphic_type_two"
    PolymorphicSuperType:
      type: object
      discriminator:
        propertyName: generation
      required:
        - generation
        - first_name
        - last_name
        - pets
      properties:
        generation:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
    PolymorphicTypeOne:
      additionalProperties: true
      allOf:
        - $ref: "#/components/schemas/PolymorphicSuperType"
        - type: object
          properties:
            child_one_name:
              type: string
    polymorphic_type_two:
      additionalProperties:
        type: string
      allOf:
        - $ref: "#/components/schemas/PolymorphicSuperType"
        - $ref: "#/components/schemas/AnotherObject"
        - type: object
          properties:
            child_two_age:
              type: integer
              format: int32

    AnotherObject:
      type: object
      properties:
        some_integer_propery:
          type: integer
          format: int32

    Pet:
      type: object
      properties:
        name:
          type: string
      required:
        - name
