openapi: 3.0.0
info:
paths:
components:
  schemas:
    SomeObj:
      type: object
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/State'
        arrayOfStates:
          type: array
          items:
            $ref: '#/components/schemas/State'
        inlinedArray:
          type: array
          items:
            discriminator:
              mapping:
                char_location: "#/components/schemas/OneObject"
                content_block_location: "#/components/schemas/TwoObject"
              propertyName: type
            oneOf:
              - "$ref": "#/components/schemas/OneObject"
              - "$ref": "#/components/schemas/TwoObject"
        inlinedObject:
          type: object
          discriminator:
            mapping:
              char_location: "#/components/schemas/OneObject"
              content_block_location: "#/components/schemas/TwoObject"
            propertyName: type
          oneOf:
            - "$ref": "#/components/schemas/OneObject"
            - "$ref": "#/components/schemas/TwoObject"
        inlinedObjectNoMappings:
          type: object
          discriminator:
            propertyName: type
          oneOf:
            - "$ref": "#/components/schemas/OneObject"
            - "$ref": "#/components/schemas/TwoObject"
    State:
      oneOf:
        - $ref: '#/components/schemas/StateA'
        - $ref: '#/components/schemas/StateB'
      discriminator:
        propertyName: status
        mapping:
          a: '#/components/schemas/StateA'
          b: '#/components/schemas/StateB'
    Status:
      type: string
      enum:
        - a
        - b
        - b1
        - b2
    StateA:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Status'
    StateB:
      oneOf:
        - $ref: '#/components/schemas/StateB1'
        - $ref: '#/components/schemas/StateB2'
      discriminator:
        propertyName: status
        mapping:
          b1: '#/components/schemas/StateB1'
          b2: '#/components/schemas/StateB2'
    StateB1:
      type: object
      required:
        - status
        - mode
      properties:
        status:
          $ref: '#/components/schemas/Status'
        mode:
          type: string
    StateB2:
      type: object
      required:
        - status
        - mode
      properties:
        status:
          $ref: '#/components/schemas/Status'
        mode:
          type: string
    OneObject:
      required:
        - type
      properties:
        type:
          description: Type Property
          type: string
    TwoObject:
      required:
        - type
      properties:
        type:
          type: string
    
    # Test has no explicit mapping, will auto-flatten YTest -> YTest1, YTest2
    SomeRequest:
      type: object
      properties:
        id:
          type: number
        events:
          type: array
          items:
            $ref: "#/components/schemas/Test"

    Test:
      oneOf:
        - $ref: "#/components/schemas/XTest"
        - $ref: "#/components/schemas/YTest"
      discriminator:
        propertyName: type

    XTest:
      type: object
      properties:
        type:
          type: string
        alt:
          type: string

    YTest:
      oneOf:
        - $ref: "#/components/schemas/YTest1"
        - $ref: "#/components/schemas/YTest2"
      discriminator:
        propertyName: type

    YTest1:
      type: object
      properties:
        type:
          type: string
        alt:
          type: string

    YTest2:
      type: object
      properties:
        type:
          type: string
        alt:
          type: string

    Poly1:
      discriminator:
        propertyName: type
        mapping:
          obj1: "#/components/schemas/Obj1"
          obj2: "#/components/schemas/Obj2"
      oneOf:
        - $ref: "#/components/schemas/Obj1"
        - $ref: "#/components/schemas/Obj2"
    Poly2:
      discriminator:
        propertyName: type
        mapping:
          obj3: '#/components/schemas/Obj3'
          obj1: '#/components/schemas/Obj1'
      oneOf:
        - $ref: '#/components/schemas/Obj3'
        - $ref: '#/components/schemas/Obj1'
    Obj1:
      required:
        - id1
        - type
      type: object
      properties:
        type:
          type: string
        id1:
          type: string
    Obj2:
      required:
        - id2
        - type
      type: object
      properties:
        type:
          type: string
        id2:
          type: string
    Obj3:
      required:
        - id3
        - type
      type: object
      properties:
        type:
          type: string
        id3:
          type: string

    # Regression test: inline oneOf where all members share a common discriminated parent.
    # The oneOf itself has no discriminator, so no sealed interface should be generated —
    # polymorphism is already handled by ParentAction's discriminator.
    ParentAction:
      type: object
      discriminator:
        propertyName: actionType
        mapping:
          CHILD_A: '#/components/schemas/ChildActionA'
          CHILD_B: '#/components/schemas/ChildActionB'
      properties:
        actionType:
          type: string
          enum:
            - CHILD_A
            - CHILD_B
      required:
        - actionType
    ChildActionA:
      allOf:
        - $ref: '#/components/schemas/ParentAction'
        - type: object
          properties:
            fieldA:
              type: string
    ChildActionB:
      allOf:
        - $ref: '#/components/schemas/ParentAction'
        - type: object
          properties:
            fieldB:
              type: integer
    ActionRequest:
      type: object
      properties:
        id:
          type: string
        action:
          oneOf:
            - $ref: '#/components/schemas/ChildActionA'
            - $ref: '#/components/schemas/ChildActionB'

    # Inline oneOf where all members share a common parent WITHOUT a discriminator.
    # ValidationErr and ServerErr each have distinct properties (fieldName, stackTrace) but the
    # oneOf carries no discriminator, so Jackson cannot select the correct subtype during
    # deserialisation. A sealed interface (ErrorWrapperError) is generated so the subtypes are
    # type-safe to produce; the field is typed as Any? so deserialization captures the raw JSON
    # as a LinkedHashMap without data loss. The correct fix is in the spec: add a discriminator.
    BaseError:
      type: object
      properties:
        message:
          type: string
        errorType:
          type: string
          enum:
            - VALIDATION
            - SERVER
      required:
        - message
        - errorType
    ValidationErr:
      allOf:
        - $ref: '#/components/schemas/BaseError'
        - type: object
          required:
            - fieldName
          properties:
            fieldName:
              type: string
    ServerErr:
      allOf:
        - $ref: '#/components/schemas/BaseError'
        - type: object
          required:
            - stackTrace
          properties:
            stackTrace:
              type: string
    ErrorWrapper:
      type: object
      properties:
        error:
          oneOf:
            - $ref: '#/components/schemas/ValidationErr'
            - $ref: '#/components/schemas/ServerErr'

    # Opted into Jackson DEDUCTION via x-jackson-subtype-deduction. Subtypes (NetworkFailure,
    # DnsFailure) have distinguishing required fields (retries vs host) so Jackson can pick
    # the right subtype. Kotlinx has no DEDUCTION equivalent and falls back to Any?.
    NetworkFailure:
      type: object
      required:
        - kind
        - retries
      properties:
        kind:
          type: string
        retries:
          type: integer
    DnsFailure:
      type: object
      required:
        - kind
        - host
      properties:
        kind:
          type: string
        host:
          type: string
    DiagnosticReport:
      type: object
      properties:
        failure:
          x-jackson-subtype-deduction: true
          oneOf:
            - $ref: '#/components/schemas/NetworkFailure'
            - $ref: '#/components/schemas/DnsFailure'

    # Named top-level array schemas whose items are a discriminated oneOf.
    # ChildActionsAll covers all members of ParentAction's discriminator mapping —
    # references to it should resolve to List<ParentAction> (the parent type).
    # ChildActionsPartial covers only a subset — it requires its own sealed interface.
    ChildActionsAll:
      type: array
      default: []
      items:
        oneOf:
          - $ref: '#/components/schemas/ChildActionA'
          - $ref: '#/components/schemas/ChildActionB'
        discriminator:
          propertyName: actionType
          mapping:
            CHILD_A: '#/components/schemas/ChildActionA'
            CHILD_B: '#/components/schemas/ChildActionB'
    ChildActionsPartial:
      type: array
      default: []
      items:
        oneOf:
          - $ref: '#/components/schemas/ChildActionA'
        discriminator:
          propertyName: actionType
          mapping:
            CHILD_A: '#/components/schemas/ChildActionA'
    ResponseWithChildActionsAll:
      type: object
      properties:
        actions:
          $ref: '#/components/schemas/ChildActionsAll'
    ResponseWithChildActionsPartial:
      type: object
      properties:
        actions:
          $ref: '#/components/schemas/ChildActionsPartial'
    DiscriminatedBase:
      type: object
      discriminator:
        propertyName: errorCode
        mapping:
          ERR_ONE: '#/components/schemas/DiscriminatedChild'
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
        message:
          type: string
    DiscriminatedChild:
      allOf:
        - $ref: '#/components/schemas/DiscriminatedBase'
        - type: object

    # Inline oneOf on a property whose branches each declare their own properties directly
    # (contrast ErrorWrapper.error, whose branches are allOf wrappers with no own properties).
    # The oneOf carries no discriminator and does not opt into deduction, so the property is
    # typed as Any; a sealed interface (PromotionEffectAdditionalData) is still generated so the
    # branch types are type-safe to produce. Regression test for #692, where that interface was
    # referenced as a supertype by both branches but never emitted.
    PromotionEffectBuyXGetY:
      type: object
      properties:
        buyQuantity:
          type: integer
    PromotionEffectAutomaticDiscount:
      type: object
      properties:
        value:
          type: number
    PromotionEffect:
      type: object
      required:
        - additionalData
      properties:
        additionalData:
          oneOf:
            - $ref: '#/components/schemas/PromotionEffectBuyXGetY'
            - $ref: '#/components/schemas/PromotionEffectAutomaticDiscount'

    # Same shape as PromotionEffect.additionalData above, but the oneOf itself carries a
    # discriminator. Regression test for a related naming bug found while fixing #692: the
    # property's own type resolution didn't thread `enclosingSchema` into `KotlinTypeInfo.from`,
    # so it disagreed with the name `ModelGenerator` used for the emitted interface and instead
    # produced an unqualified, non-existent type name (`AdditionalData` instead of
    # `PromotionEffectDiscriminatedAdditionalData`).
    PromotionEffectDiscriminatedBuyXGetY:
      type: object
      properties:
        buyQuantity:
          type: integer
    PromotionEffectDiscriminatedAutomaticDiscount:
      type: object
      properties:
        value:
          type: number
    PromotionEffectDiscriminated:
      type: object
      required:
        - additionalData
      properties:
        additionalData:
          discriminator:
            propertyName: kind
            mapping:
              buyXGetY: '#/components/schemas/PromotionEffectDiscriminatedBuyXGetY'
              automaticDiscount: '#/components/schemas/PromotionEffectDiscriminatedAutomaticDiscount'
          oneOf:
            - $ref: '#/components/schemas/PromotionEffectDiscriminatedBuyXGetY'
            - $ref: '#/components/schemas/PromotionEffectDiscriminatedAutomaticDiscount'

    # Same discriminated-inline-oneOf-property shape as PromotionEffectDiscriminated above, but
    # declared on an allOf parent that is itself part of a discriminated hierarchy, so the
    # property classifies with `isInherited = true`. Regression test for a second instance of the
    # same naming bug: the inherited branch must resolve the property's type using the schema
    # that declares the property (InheritedOneOfParent), not the enclosing child schema, to match
    # the interface name ModelGenerator emits (InheritedOneOfParentEffect).
    InheritedOneOfBranchA:
      type: object
      properties:
        aQty:
          type: integer
    InheritedOneOfBranchB:
      type: object
      properties:
        bQty:
          type: integer
    InheritedOneOfParent:
      type: object
      discriminator:
        propertyName: actionType
        mapping:
          CHILD_ONE: '#/components/schemas/InheritedOneOfChildOne'
          CHILD_TWO: '#/components/schemas/InheritedOneOfChildTwo'
      required:
        - actionType
      properties:
        actionType:
          type: string
        effect:
          discriminator:
            propertyName: kind
            mapping:
              a: '#/components/schemas/InheritedOneOfBranchA'
              b: '#/components/schemas/InheritedOneOfBranchB'
          oneOf:
            - $ref: '#/components/schemas/InheritedOneOfBranchA'
            - $ref: '#/components/schemas/InheritedOneOfBranchB'
    InheritedOneOfChildOne:
      allOf:
        - $ref: '#/components/schemas/InheritedOneOfParent'
        - type: object
          properties:
            extraOne:
              type: string
    InheritedOneOfChildTwo:
      allOf:
        - $ref: '#/components/schemas/InheritedOneOfParent'
        - type: object
          properties:
            extraTwo:
              type: string
  responses:
    NarrowedDiscriminatorResponse:
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/DiscriminatedChild'
              - type: object
                required: [errorCode]
                properties:
                  errorCode:
                    type: string
                    enum: [ERR_ONE]
