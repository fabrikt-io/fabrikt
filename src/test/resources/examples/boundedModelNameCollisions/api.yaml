openapi: "3.0.0"
info:
  title: "Bounded Model Name Collisions"
  version: "1.0.0"
paths:
  /a:
    get:
      operationId: getA
      parameters:
        - name: $select
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - Alpha
                - Beta
      responses:
        200:
          description: "ok"
  /b:
    get:
      operationId: getB
      parameters:
        - name: $select
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - Gamma
                - Delta
      responses:
        200:
          description: "ok"
  /c:
    get:
      operationId: getC
      parameters:
        - name: $select
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - Epsilon
                - Zeta
      responses:
        200:
          description: "ok"
  /d:
    get:
      operationId: getD
      responses:
        200:
          description: "ok"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
components:
  schemas:
    # Regression test for #702: Product.state's inline enum computes the class name
    # "ProductState" (its enclosing schema's name plus its own name), which coincidentally
    # collides with the unrelated top-level ProductState component below. The two must
    # resolve to distinct classes rather than one silently taking the other's name.
    Product:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - live
            - draft
    ProductState:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/Product/properties/state"
