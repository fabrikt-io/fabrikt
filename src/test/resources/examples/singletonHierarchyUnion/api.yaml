openapi: 3.0.4
info:
  title: Singleton hierarchy unions
  version: '1'
paths:
  /middle:
    post:
      operationId: echoMiddle
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Middle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Middle'
      responses:
        '200':
          description: A middle or one of its descendants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Middle'

components:
  schemas:
    Base:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          type: string
          minLength: 1
        note:
          type: string
          nullable: true
          default: hello
      discriminator:
        propertyName: kind
        mapping:
          middle: '#/components/schemas/Middle'
          child: '#/components/schemas/Child'
          sibling: '#/components/schemas/Sibling'
          third: '#/components/schemas/Third'
    Middle:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            middle:
              type: string
              nullable: true
    Child:
      allOf:
        - $ref: '#/components/schemas/Middle'
        - type: object
          required: [kind, label]
          properties:
            kind:
              type: string
              enum: [child]
            label:
              type: string
              minLength: 1
    Sibling:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [sibling]
    Third:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [third]
    Holder:
      type: object
      properties:
        direct:
          $ref: '#/components/schemas/Middle'
        directValues:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Middle'
        directMap:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Middle'
        bag:
          $ref: '#/components/schemas/MiddleBag'
        single:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/Child'
        values:
          type: array
          nullable: true
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/Child'
        nullableValues:
          type: array
          nullable: true
          items:
            nullable: true
            oneOf:
              - $ref: '#/components/schemas/Child'
        parent:
          oneOf:
            - $ref: '#/components/schemas/Base'
        middle:
          oneOf:
            - $ref: '#/components/schemas/Middle'
        subset:
          oneOf:
            - $ref: '#/components/schemas/Child'
            - $ref: '#/components/schemas/Sibling'
        family:
          oneOf:
            - $ref: '#/components/schemas/Base'
            - $ref: '#/components/schemas/Middle'
            - $ref: '#/components/schemas/Child'
            - $ref: '#/components/schemas/Sibling'
            - $ref: '#/components/schemas/Third'
        childrenOnly:
          oneOf:
            - $ref: '#/components/schemas/Middle'
            - $ref: '#/components/schemas/Child'
            - $ref: '#/components/schemas/Sibling'
            - $ref: '#/components/schemas/Third'
        preciseSubset:
          oneOf:
            - $ref: '#/components/schemas/Child'
            - $ref: '#/components/schemas/Sibling'
          discriminator:
            propertyName: kind
            mapping:
              child: '#/components/schemas/Child'
              sibling: '#/components/schemas/Sibling'
    MiddleBag:
      type: object
      properties:
        tag:
          type: string
      additionalProperties:
        $ref: '#/components/schemas/Middle'
