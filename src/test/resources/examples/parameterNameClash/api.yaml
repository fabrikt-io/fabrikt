openapi: 3.0.0
info:
  version: '1'
  title: pathLevelParameters
paths:
  /example/{b}:
    get:
      summary: Returns 100% of the matching records
      description: |
        The merchant key must be prefixed by `key%3D`.
        A literal %S is prose here, not a format specifier.
      parameters:
        - in: path
          name: b
          required: true
          description: Identifier, percent-encoded (%3D is '=')
          schema:
            type: string
        - in: query
          name: b
          required: true
          schema:
            type: string
      responses:
        '204':
          description: example
  /example:
    post:
      parameters:
        - in: query
          name: someObject
          required: true
          schema:
            type: string
      requestBody:
        description: example
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/SomeObject'
      responses:
        '204':
          description: example
components:
  schemas:
    SomeObject:
      type: object
      properties:
        test:
          type: string