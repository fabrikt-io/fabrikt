openapi: 3.0.3
info:
  title: String constraints on non-String types
  version: 1.0.0
paths:
  /foos/{foo_id}/bars:
    get:
      operationId: listBars
      parameters:
        - name: foo_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FooId'
        - name: other_foo_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FooId'
        - name: reference
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 16
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
            maxLength: 32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bar'
components:
  schemas:
    Bar:
      type: object
      required:
        - foo_id
        - foo_ids
        - reference
      properties:
        foo_id:
          $ref: '#/components/schemas/FooId'
        foo_ids:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/FooId'
        reference:
          type: string
          minLength: 1
          maxLength: 16
          pattern: '^[A-Z0-9-]+$'
        created_at:
          type: string
          format: date-time
          maxLength: 32
          pattern: '^\d{4}-\d{2}-\d{2}T.+$'
    FooId:
      type: string
      format: foo-id
      minLength: 30
      maxLength: 30
      pattern: '^foo_[0-9a-z]{26}$'
