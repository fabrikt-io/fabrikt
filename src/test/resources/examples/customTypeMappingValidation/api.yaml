openapi: 3.0.3
info:
  title: Custom type mapping validation example
  version: 1.0.0
paths:
  /merchants/{merchant_id}/orders:
    get:
      operationId: listOrders
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: referrer_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: reference
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 16
        - name: slug
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      required:
        - merchant_id
        - merchant_ids
        - reference
      properties:
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        merchant_ids:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/MerchantId'
        reference:
          type: string
          minLength: 1
          maxLength: 16
          pattern: '^[A-Z0-9-]+$'
        slug:
          $ref: '#/components/schemas/Slug'
    MerchantId:
      type: string
      format: merchant-id
      minLength: 30
      maxLength: 30
      pattern: '^mer_[0-9a-z]{26}$'
    Slug:
      type: string
      format: slug
      maxLength: 32
      pattern: '^[a-z0-9-]+$'
