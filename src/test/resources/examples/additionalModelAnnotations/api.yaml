openapi: 3.0.4
info:
  title: Additional model annotations
  version: 1.0.0
paths: {}
components:
  schemas:
    Choice:
      oneOf:
        - $ref: '#/components/schemas/Entry'
        - $ref: '#/components/schemas/Marker'
    Entry:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        state:
          $ref: '#/components/schemas/State'
    Marker:
      type: object
    State:
      type: string
      enum:
        - OPEN
        - CLOSED
